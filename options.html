<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FC5K course options</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>html,body{margin:0;height:100%;font-family:Inter,sans-serif}#m{position:absolute;inset:0}
#p{position:absolute;top:10px;right:10px;z-index:1000;background:#fff;padding:10px 12px;max-width:300px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#p label{display:block;margin:4px 0;cursor:pointer}#p b{font-size:14px}.bad{color:#c00}</style></head>
<body><div id="m"></div><div id="p"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
var m=L.map('m'),osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(m),
sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});
L.control.layers({Map:osm,Satellite:sat}).addTo(m);
var line,spurs=[],opts;
Promise.all([fetch('data/options.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/parks.json').then(r=>r.json())]).then(function(r){
  opts=r[0]; r[1].forEach(function(p){L.polygon(p.pts,{color:'#0a0',weight:1,fillOpacity:.25}).addTo(m).bindTooltip(p.name);});
  var p=document.getElementById('p'),first=null;
  for(var k in opts){var id='o'+Object.keys(opts).indexOf(k);
    p.insertAdjacentHTML('beforeend','<label><input type="radio" name="o" value="'+k+'"> <b>'+k+'</b> · '+opts[k].km+' km'+(opts[k].spurs.length?' <span class="bad">· '+opts[k].spurs.length+' out-and-back</span>':'')+'<br><small>'+opts[k].blurb+'</small></label>');
    first=first||k;}
  p.addEventListener('change',function(e){show(e.target.value)});
  p.querySelector('input').checked=true; show(first);
  window.show=show;
});
function show(k){if(line){m.removeLayer(line);} spurs.forEach(function(s){m.removeLayer(s)}); spurs=[];
  line=L.polyline(opts[k].shape,{color:'#ff1e00',weight:5}).addTo(m); m.fitBounds(line.getBounds().pad(0.05));
  opts[k].spurs.forEach(function(s){spurs.push(L.circleMarker(s,{radius:9,color:'#c00',fillOpacity:.3}).addTo(m))});
  L.marker(opts[k].shape[0],{icon:L.icon({iconUrl:'logo.svg',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(m);}
</script></body></html>
